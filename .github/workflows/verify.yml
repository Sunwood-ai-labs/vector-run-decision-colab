name: Verify Colab benchmark scaffold
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
      - name: Validate notebook JSON, empty outputs, seven model pins and game pin
        run: python scripts/validate_colab_notebooks.py
      - name: Run CPU-only adapter and blocked-report unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify formal result hashes, pins and excluded-input gates
        run: python scripts/summarize_results.py --results-root results --self-test --check
