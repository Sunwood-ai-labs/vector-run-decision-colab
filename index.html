<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>決断レーン — Decision 2.0 ベンチ</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <header class="top">
    <p class="mark">DL-20</p>
    <div>
      <h1>決断レーン</h1>
      <p>横スクロールの走者に、Decision 2.0 と同じ3つの質問をさせる。文章は生成しない。</p>
    </div>
  </header>

  <main>
    <section class="stage">
      <canvas id="view" width="960" height="460" aria-label="決断レーンのコース"></canvas>
      <div id="hud" class="hud"></div>
      <p id="status" class="status">ルール走者を再生しています。キーを押すと、その場から自分のランになります。</p>
    </section>

    <section class="panel">
      <div class="row">
        <button type="button" data-mode="human">自分で走る</button>
        <button type="button" data-mode="rule" aria-pressed="true">ルールを見る</button>
        <button type="button" data-mode="idle">停止させる</button>
        <button type="button" data-mode="remote">モデルに任せる</button>
      </div>
      <div class="fields">
        <label>シード <input id="seed" type="number" min="1" value="1"></label>
        <label>問数
          <select id="questions">
            <option value="3">3問（本番）</option>
            <option value="64">64問（1パスの上限）</option>
          </select>
        </label>
        <label>モデルの待ち方
          <select id="timing">
            <option value="step">判断まで止める</option>
            <option value="realtime">走ったまま</option>
          </select>
        </label>
        <button type="button" id="restart">このシードで再走</button>
        <button type="button" id="bench" class="accent">12シードを測る</button>
      </div>
      <label class="wide">エンドポイント
        <input id="endpoint" type="url" value="http://127.0.0.1:8780/v1/systemone" spellcheck="false">
      </label>
      <label class="wide">モデル
        <input id="model" type="text" value="vllm-sr/Decision-2.0-Kai-0.6B" spellcheck="false">
      </label>

      <div id="bars" class="bars"></div>
      <p id="extra" class="extra">判断はまだありません。</p>

      <ul class="legend">
        <li><i class="swatch crate"></i>箱はジャンプ</li>
        <li><i class="swatch beam"></i>梁はスライディング</li>
        <li><i class="swatch drone"></i>ドローンはストライク</li>
        <li><i class="swatch gap"></i>欠線もジャンプ</li>
      </ul>
      <p class="help">Space / ↑ 跳ぶ　↓ くぐる　J 打つ　P 一時停止　R 再走。黄緑の縦線が、ルールの作動距離です。</p>
    </section>

    <section class="board">
      <h2>ベンチ</h2>
      <div id="results"></div>
    </section>
  </main>

  <div class="touch">
    <button type="button" data-touch="TouchSlide">くぐる</button>
    <button type="button" data-touch="TouchJump">跳ぶ</button>
    <button type="button" data-touch="TouchStrike">打つ</button>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
