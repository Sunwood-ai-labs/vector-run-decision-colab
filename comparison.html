<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VECTOR RUN — Decision 2.0 実測trace比較</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #0b1117; color: #edf3f6; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: auto; aspect-ratio: 16 / 9; }
    .controls { display: flex; align-items: center; gap: 16px; padding: 14px 24px; }
    button { padding: 10px 24px; color: #0b1117; background: #88efcd; border: 0; border-radius: 6px; font: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    .capture .controls { display: none; }
    #message { font-size: 14px; }
  </style>
</head>
<body>
  <canvas id="comparison" width="1920" height="1080" aria-label="Decision 2.0 7モデルとrule、idleの実測traceを共通時計で1倍速再生する9タイル比較"></canvas>
  <div class="controls"><button id="start" disabled>1×で再生</button><span id="message" role="status">実測traceを確認中…</span></div>
  <script type="module" src="./capture/player.js"></script>
</body>
</html>
